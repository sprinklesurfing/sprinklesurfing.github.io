<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#faf9f6">
    <title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Tim Wesley home">Tim Wesley</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/bio/' | relative_url }}" {% if page.url == '/bio/' %}aria-current="page"{% endif %}>Bio</a>
          <a href="{{ '/research/' | relative_url }}" {% if page.url == '/research/' %}aria-current="page"{% endif %}>Research</a>
          <a href="{{ '/teaching/' | relative_url }}" {% if page.url == '/teaching/' %}aria-current="page"{% endif %}>Teaching</a>
        </nav>
      </header>
      <main id="main">{{ content }}</main>
      <footer class="site-footer"><span>Tim Wesley</span><a href="#main">Back to top ↑</a></footer>
    </div>
  </body>
</html>
